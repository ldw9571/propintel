spring:
  application:
    name: propintel-backend

  datasource:
    url: jdbc:h2:mem:propintel;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=600s

server:
  port: 8080

openai:
  api-key: ${OPENAI_API_KEY:test-key}
  model: gpt-3.5-turbo
  max-tokens: 1000

molit:
  api-key: b9d00d2fe6ff705588f80d61acf79e878cfd64d72bafe548032d40fed039d5a1
  base-url: https://apis.data.go.kr/1613000